name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install iOS dependencies
        run: |
          cd ios && pod install && cd ..

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set up macOS keychain for signing
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add signing key
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > signing_key.p12
          
          # Create a new keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-password -p "$KEYCHAIN_PASSWORD" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          
          # Import the signing certificate
          security import signing_key.p12 -P "" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain

      - name: Update iOS signing config
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          # Create AppIcon set if missing
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          
          # Update the bundle identifier in project
          sed -i '' "s/bundle-identifier-here/$BUNDLE_ID/g" ios/Runner/Info.plist
          sed -i '' "s/com.example.appGranjaAvicola/$BUNDLE_ID/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS (Simulator)
        run: |
          flutter build ios --simulator --no-codesign

      - name: Build iOS (Release without codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Create artifact directory
        run: |
          mkdir -p build/ios-ipa
          cp -r build/ios/iphoneos/Build/Products/Release-iphoneos/*.app build/ios-ipa/

      - name: Create ZIP of app
        run: |
          cd build/ios-ipa
          zip -r ../app.zip *.app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/app.zip
          retention-days: 7

      - name: Upload debug symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-dsym
          path: build/ios/iphoneos/Build/Products/Release-iphoneos/*.dSYM
          retention-days: 7