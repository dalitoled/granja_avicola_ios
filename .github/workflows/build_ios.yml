name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean iOS pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          cd ..

      - name: Install iOS dependencies
        run: |
          cd ios && pod install --repo-update && cd ..

      - name: Build iOS for simulator
        run: |
          flutter build ios --simulator --no-codesign

      - name: Package as IPA
        run: |
          APP_DIR="build/ios/iphonesimulator"
          mkdir -p build/ios-unsigned
          if [ -d "$APP_DIR" ]; then
            cd "$APP_DIR"
            ls -la
            zip -r ../../../build/ios-unsigned/Runner.ipa *.app
          else
            echo "Directory not found: $APP_DIR"
            find build -name "*.app" -type d 2>/dev/null | head -5
          fi

      - name: List built files
        run: |
          ls -la build/ios-unsigned/ 2>/dev/null || echo "No files found"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios-unsigned/*.ipa
          retention-days: 7