name: Build iOS Simulator App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install iOS dependencies
        run: |
          cd ios && pod install && cd ..

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS for Simulator
        run: |
          flutter build ios --simulator --no-codesign

      - name: Build iOS Release (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Create artifact directory
        run: |
          mkdir -p build/ios-ipa
          cp -r build/ios/iphoneos/Build/Products/Release-iphoneos/*.app build/ios-ipa/ 2>/dev/null || true
          cp -r build/ios/iphonesimulator/Build/Products/Release-iphonesimulator/*.app build/ios-ipa/ 2>/dev/null || true

      - name: Create ZIP of app
        run: |
          cd build/ios-ipa || exit 0
          if [ -d *.app ]; then
            zip -r ../app.zip *.app
          else
            echo "No .app bundle found"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/app.zip
          retention-days: 7
        continue-on-error: true

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner
          path: build/ios/iphonesimulator/Build/Products/Release-iphonesimulator/Runner.app
          retention-days: 7
        continue-on-error: true